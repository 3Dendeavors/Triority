name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, such as v1.4.13.
        required: true
        type: string

run-name: Android Release ${{ inputs.tag }}

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      APK_BASENAME: Triority-${{ inputs.tag }}.apk

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore private Android files
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          TRIORITY_RELEASE_KEYSTORE_BASE64: ${{ secrets.TRIORITY_RELEASE_KEYSTORE_BASE64 }}
          TRIORITY_RELEASE_STORE_PASSWORD: ${{ secrets.TRIORITY_RELEASE_STORE_PASSWORD }}
          TRIORITY_RELEASE_KEY_ALIAS: ${{ secrets.TRIORITY_RELEASE_KEY_ALIAS }}
          TRIORITY_RELEASE_KEY_PASSWORD: ${{ secrets.TRIORITY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in \
            GOOGLE_SERVICES_JSON_BASE64 \
            TRIORITY_RELEASE_KEYSTORE_BASE64 \
            TRIORITY_RELEASE_STORE_PASSWORD \
            TRIORITY_RELEASE_KEY_ALIAS \
            TRIORITY_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing release secret::$secret_name is not configured. Run scripts/prepare-github-release-secrets.ps1 -Upload from the private release workspace."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$TRIORITY_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/triority-release.keystore

          {
            printf 'TRIORITY_RELEASE_STORE_FILE=triority-release.keystore\n'
            printf 'TRIORITY_RELEASE_STORE_PASSWORD=%s\n' "$TRIORITY_RELEASE_STORE_PASSWORD"
            printf 'TRIORITY_RELEASE_KEY_ALIAS=%s\n' "$TRIORITY_RELEASE_KEY_ALIAS"
            printf 'TRIORITY_RELEASE_KEY_PASSWORD=%s\n' "$TRIORITY_RELEASE_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Read Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-version.js --tag "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:createBundleReleaseJsAndAssets --rerun-tasks :app:assembleRelease --no-daemon

      - name: Name APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_BASENAME"
          echo "apk_path=$RUNNER_TEMP/$APK_BASENAME" >> "$GITHUB_ENV"
          apk_sha256="$(sha256sum "$RUNNER_TEMP/$APK_BASENAME" | awk '{print toupper($1)}')"
          printf '%s  %s\n' "$apk_sha256" "$APK_BASENAME" > "$RUNNER_TEMP/$APK_BASENAME.sha256"
          echo "APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Triority $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --title "Triority $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$apk_path#$APK_BASENAME" --clobber
          gh release upload "$RELEASE_TAG" "$apk_path.sha256#$APK_BASENAME.sha256" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK_BASENAME" >/dev/null

      - name: Update latest.json on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_BASENAME}"
          release_notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"

          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main

          APK_URL="$apk_url" APK_SHA256="$APK_SHA256" RELEASE_URL="$release_url" RELEASE_NOTES="$release_notes" node <<'NODE'
          const fs = require('fs');
          const manifest = {
            versionName: '${{ steps.version.outputs.version_name }}',
            versionCode: Number('${{ steps.version.outputs.version_code }}'),
            apkUrl: process.env.APK_URL,
            sha256: process.env.APK_SHA256,
            releaseNotes: process.env.RELEASE_NOTES || '',
            releaseNotesUrl: process.env.RELEASE_URL,
            required: false,
          };
          fs.writeFileSync('latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          if git diff --quiet -- latest.json; then
            echo "latest.json already points to $RELEASE_TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for $RELEASE_TAG"
          git push origin main
